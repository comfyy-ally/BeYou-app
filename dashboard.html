<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-color: #334155;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .user-info h2 {
            font-size: 20px;
            color: #ffffff;
        }

        .user-info p {
            font-size: 14px;
            color: #94a3b8;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .balance-card span {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
        }

        .balance-card h1 {
            font-size: 32px;
            margin-top: 5px;
            color: #ffffff;
        }

        .payout-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 14px;
            color: #cbd5e1;
        }

        .form-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .withdraw-btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .withdraw-btn:hover {
            background-color: #0369a1;
        }

        .withdraw-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .status-msg.error {
            color: #f87171;
        }

        .status-msg.success {
            color: #4ade80;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- User Profile Section -->
        <div class="profile-section">
            <div class="avatar">👤</div>
            <div class="user-info">
                <h2 id="userName">candice</h2>
                <p><span id="friendCount">3</span> friends · <span id="postCount">2</span> posts</p>
            </div>
        </div>

        <!-- Total Earnings Balance -->
        <div class="balance-card">
            <span>Total Earnings Balance</span>
            <h1 id="earningsDisplay">$0.20 USD</h1>
        </div>

        <!-- PayPal Withdrawal Form -->
        <form id="payoutForm" class="payout-form">
            <div class="form-group">
                <label for="paypalEmail">PayPal Email Address</label>
                <input 
                    type="email" 
                    id="paypalEmail" 
                    placeholder="name@example.com" 
                    required 
                />
            </div>

            <div class="form-group">
                <label for="withdrawAmount">Amount to Withdraw ($)</label>
                <input 
                    type="number" 
                    id="withdrawAmount" 
                    step="0.01" 
                    min="0.01" 
                    value="0.20" 
                    required 
                />
            </div>

            <button type="submit" id="withdrawBtn" class="withdraw-btn">
                Withdraw to PayPal
            </button>
        </form>

        <div id="statusMessage" class="status-msg"></div>
    </div>

    <script>
        const payoutForm = document.getElementById('payoutForm');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const statusMessage = document.getElementById('statusMessage');

        payoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('paypalEmail').value.trim();
            const amount = document.getElementById('withdrawAmount').value;

            if (!email || !amount) {
                showStatus('Please fill in all fields.', 'error');
                return;
            }

            // Disable button and show loading text
            withdrawBtn.disabled = true;
            withdrawBtn.innerText = 'Processing PayPal Transfer...';
            statusMessage.innerText = '';
            statusMessage.className = 'status-msg';

            try {
                const response = await fetch('/api/withdraw-to-paypal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        paypalEmail: email,
                        amountInDollars: amount
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus(result.message, 'success');
                    alert(result.message);
                } else {
                    showStatus(`Transfer failed: ${result.error}`, 'error');
                    alert(`PayPal transfer failed: ${result.error}`);
                }
            } catch (error) {
                console.error('Request Error:', error);
                showStatus('An error occurred during withdrawal. Please try again.', 'error');
                alert('An error occurred during withdrawal.');
            } finally {
                withdrawBtn.disabled = false;
                withdrawBtn.innerText = 'Withdraw to PayPal';
            }
        });

        function showStatus(msg, type) {
            statusMessage.innerText = msg;
            statusMessage.className = `status-msg ${type}`;
        }
    </script>

</body>
</html>
