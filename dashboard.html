<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            background-color: #334155;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .user-info h2 {
            font-size: 20px;
            color: #ffffff;
        }

        .user-info p {
            font-size: 14px;
            color: #94a3b8;
        }

        .balance-card {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .balance-card span {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e0f2fe;
        }

        .balance-card h1 {
            font-size: 32px;
            margin-top: 5px;
            color: #ffffff;
        }

        .payout-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            color: #cbd5e1;
        }

        .form-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        /* Post Feed Styling */
        .feed-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .post-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-content {
            font-size: 14px;
            color: #e2e8f0;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .action-btn {
            background-color: #334155;
            color: #cbd5e1;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #475569;
            color: #ffffff;
        }

        .action-btn.delete {
            background-color: #7f1d1d;
            color: #fca5a5;
        }

        .action-btn.delete:hover {
            background-color: #991b1b;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
        }
        .status-msg.error { color: #f87171; }
        .status-msg.success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Profile & Earnings Card -->
        <div class="card">
            <div class="profile-section">
                <div class="avatar">👤</div>
                <div class="user-info">
                    <h2>candice</h2>
                    <p>3 friends · <span id="postCountDisplay">2</span> posts</p>
                </div>
            </div>

            <div class="balance-card">
                <span>Total Earnings Balance</span>
                <h1>$0.20 USD</h1>
            </div>

            <!-- PayPal Payout Form -->
            <form id="payoutForm" class="payout-form">
                <div class="form-group">
                    <label for="paypalEmail">PayPal Email Address</label>
                    <input 
                        type="email" 
                        id="paypalEmail" 
                        value="lenkoekarabo16@gmail.com" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="withdrawAmount">Amount to Withdraw ($)</label>
                    <input 
                        type="number" 
                        id="withdrawAmount" 
                        step="0.01" 
                        min="0.01" 
                        value="0.20" 
                        required 
                    />
                </div>

                <button type="submit" id="withdrawBtn" class="btn">Withdraw to PayPal</button>
            </form>
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <!-- Feed & Post Actions Section -->
        <div class="card">
            <div class="feed-header">Your Posts</div>
            <div id="feedContainer">
                <div class="post-card" id="post-1">
                    <div class="post-content">Welcome to TexUs! Check out our new direct payout system.</div>
                    <div class="post-actions">
                        <button class="action-btn" onclick="hidePost('post-1')">Hide</button>
                        <button class="action-btn" onclick="archivePost('post-1')">Archive</button>
                        <button class="action-btn delete" onclick="deletePost('post-1')">Delete</button>
                    </div>
                </div>

                <div class="post-card" id="post-2">
                    <div class="post-content">Earnings update: ad view payout rate set to $0.10 / view.</div>
                    <div class="post-actions">
                        <button class="action-btn" onclick="hidePost('post-2')">Hide</button>
                        <button class="action-btn" onclick="archivePost('post-2')">Archive</button>
                        <button class="action-btn delete" onclick="deletePost('post-2')">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Withdrawal Handler ---
        const payoutForm = document.getElementById('payoutForm');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const statusMessage = document.getElementById('statusMessage');

        payoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('paypalEmail').value.trim();
            let amount = document.getElementById('withdrawAmount').value;

            // Replace comma with dot if present
            amount = amount.replace(',', '.');

            withdrawBtn.disabled = true;
            withdrawBtn.innerText = 'Processing PayPal Transfer...';
            statusMessage.innerText = '';
            statusMessage.className = 'status-msg';

            try {
                const response = await fetch('/api/withdraw-to-paypal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paypalEmail: email,
                        amountInDollars: amount
                    })
                });

                const result = await response.json();

                if (result.success) {
                    statusMessage.innerText = result.message;
                    statusMessage.className = 'status-msg success';
                    alert(result.message);
                } else {
                    statusMessage.innerText = `Transfer failed: ${result.error}`;
                    statusMessage.className = 'status-msg error';
                    alert(`PayPal transfer failed: ${result.error}`);
                }
            } catch (error) {
                console.error('Request Error:', error);
                statusMessage.innerText = 'An error occurred during withdrawal.';
                statusMessage.className = 'status-msg error';
                alert('An error occurred during withdrawal.');
            } finally {
                withdrawBtn.disabled = false;
                withdrawBtn.innerText = 'Withdraw to PayPal';
            }
        });

        // --- Post Actions ---
        function deletePost(postId) {
            if (confirm('Are you sure you want to delete this post?')) {
                const el = document.getElementById(postId);
                if (el) el.remove();
                updatePostCount();
            }
        }

        function archivePost(postId) {
            const el = document.getElementById(postId);
            if (el) {
                el.style.opacity = '0.5';
                alert('Post archived.');
            }
        }

        function hidePost(postId) {
            const el = document.getElementById(postId);
            if (el) {
                el.style.display = 'none';
                updatePostCount();
            }
        }

        function updatePostCount() {
            const container = document.getElementById('feedContainer');
            const visiblePosts = Array.from(container.children).filter(child => child.style.display !== 'none');
            document.getElementById('postCountDisplay').innerText = visiblePosts.length;
        }
    </script>
</body>
</html>
