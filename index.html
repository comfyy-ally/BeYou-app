<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TexUs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .splash-container {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.6s ease-out;
    }

    .app-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 60px;
      display: block;
    }

    /* Precision container for the three bouncing ellipses under TexUs */
    .dots-overlay {
      position: absolute;
      top: 64.5%;
      left: 49.5%;
      transform: translate(-50%, -50%);
      background: rgba(15, 2, 14, 0.92);
      padding: 5px 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff85d8, #ff0099);
      box-shadow: 0 0 10px #ff0099, 0 0 18px rgba(255, 0, 153, 0.8);
      animation: bounceSequence 1.1s infinite ease-in-out;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .dot:nth-child(2) {
      animation-delay: 0.18s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes bounceSequence {
      0%, 60%, 100% {
        transform: translateY(0) scale(1);
      }
      30% {
        transform: translateY(-9px) scale(1.15);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <img src="icon.jpg" alt="TexUs Logo" class="app-icon">

    <!-- Sequential bouncing dots -->
    <div class="dots-overlay">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <script>
    // Redirects to dashboard after 3 seconds
    setTimeout(() => {
      window.location.replace("dashboard.html");
    }, 3000);
  </script>

</body>
</html>
