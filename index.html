<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeYou - Sign In / Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .app-logo {
            font-size: 32px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #764ba2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5a3782;
        }

        .switch-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .switch-text span {
            color: #764ba2;
            cursor: pointer;
            font-weight: bold;
        }

        .switch-text span:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        .error {
            color: #e74c3c;
        }

        .success {
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-logo">BeYou</div>

        <div id="login-form" class="form-container active">
            <h2>Welcome Back</h2>
            <div class="input-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="handleLogin()">Sign In</button>
            <p id="login-msg" class="message"></p>
            <p class="switch-text">Don't have an account? <span onclick="switchForm('signup')">Sign Up</span></p>
        </div>

        <div id="signup-form" class="form-container">
            <h2>Create Account</h2>
            <div class="input-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password">
            </div>
            <button class="btn" onclick="handleSignup()">Sign Up</button>
            <p id="signup-msg" class="message"></p>
            <p class="switch-text">Already have an account? <span onclick="switchForm('login')">Sign In</span></p>
        </div>

    </div>

    <script>
        // Switch between Sign In and Sign Up views
        function switchForm(formType) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            document.getElementById('login-msg').innerText = '';
            document.getElementById('signup-msg').innerText = '';

            if (formType === 'signup') {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
            } else {
                signupForm.classList.remove('active');
                loginForm.classList.add('active');
            }
        }

        // Handle client-side registration using localStorage (No MongoDB needed)
        function handleSignup() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const msg = document.getElementById('signup-msg');

            if (!name || !email || !password) {
                msg.className = 'message error';
                msg.innerText = 'Please fill in all fields.';
                return;
            }

            // Get existing users or initialize empty array
            let users = JSON.parse(localStorage.getItem('beyou_users')) || [];

            // Check if user already exists
            const userExists = users.some(u => u.email === email);
            if (userExists) {
                msg.className = 'message error';
                msg.innerText = 'Email is already registered.';
                return;
            }

            // Save new user
            users.push({ name, email, password });
            localStorage.setItem('beyou_users', JSON.stringify(users));

            msg.className = 'message success';
            msg.innerText = 'Account created successfully! You can now sign in.';
            
            setTimeout(() => {
                switchForm('login');
            }, 1500);
        }

        // Handle client-side login using localStorage
        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msg = document.getElementById('login-msg');

            if (!email || !password) {
                msg.className = 'message error';
                msg.innerText = 'Please fill in all fields.';
                return;
            }

            let users = JSON.parse(localStorage.getItem('beyou_users')) || [];

            // Verify credentials
            const validUser = users.find(u => u.email === email && u.password === password);

            if (validUser) {
                msg.className = 'message success';
                msg.innerText = `Welcome back, ${validUser.name}! Loading app...`;
                
                // Store active session flag
                localStorage.setItem('beyou_logged_in', JSON.stringify(validUser));

                // Here you can redirect or load the rest of your app interface:
                // window.location.href = 'dashboard.html';
            } else {
                msg.className = 'message error';
                msg.innerText = 'Invalid email or password.';
            }
        }
    </script>
</body>
</html>
