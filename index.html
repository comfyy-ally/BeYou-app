<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs Video Stream</title>
    <link rel="stylesheet" href="CallScreen.css">
</head>
<body>
    <div class="app-container">
        <!-- App Brand Header in Cursive -->
        <div class="app-header">
            <h1>TexUs</h1>
        </div>

        <!-- TikTok-style Vertical Feed -->
        <div class="video-feed" id="videoFeed">
            <div class="video-card">
                <video class="feed-video" src="https://www.w3schools.com/html/mov_bbb.mp4" loop muted playsinline></video>
                <div class="video-overlay">
                    <h3>@creator_official</h3>
                    <p>Check out this amazing movie clip on TexUs! #streaming #texus</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videos = document.querySelectorAll('.feed-video');
        
        videos.forEach(video => {
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const vid = entry.target;
                if (entry.isIntersecting) {
                    vid.play().catch(() => {});
                } else {
                    vid.pause();
                }
            });
        }, { threshold: 0.6 });

        videos.forEach(v => observer.observe(v));
    </script>
</body>
</html>
