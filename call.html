<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs - Video Call</title>
    <link rel="stylesheet" href="CallScreen.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <h1 style="font-family: cursive; color: #ff3366;">TexUs</h1>
        </div>

        <div class="call-screen-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh;">
            <!-- Start Call Button -->
            <button id="callBtn" class="call-btn" style="padding: 15px 30px; font-size: 1.2rem; background: #ff3366; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                Start Video Call
            </button>

            <!-- Active Call Video Grid (Hidden until call starts) -->
            <div id="activeCallGrid" class="active-call-grid" style="display: none; position: relative; width: 100%; max-width: 600px; height: 450px; background: #000; border-radius: 12px; overflow: hidden; margin-top: 20px;">
                <!-- Remote Video (Simulated/Incoming) -->
                <video id="remoteVideo" autoPlay playsInline style="width: 100%; height: 100%; object-fit: cover;"></video>
                
                <!-- Local Video (Your Camera) -->
                <video id="localVideo" autoPlay playsInline muted style="position: absolute; bottom: 20px; right: 20px; width: 120px; height: 160px; object-fit: cover; border-radius: 10px; border: 2px solid white; background: #222;"></video>
                
                <!-- End Call Button -->
                <button id="hangupBtn" class="hangup-btn" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: #ff4d4d; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">
                    End Call
                </button>
            </div>
        </div>
    </div>

    <!-- Script to handle media permissions and UI toggles -->
    <script>
        const callBtn = document.getElementById('callBtn');
        const activeCallGrid = document.getElementById('activeCallGrid');
        const hangupBtn = document.getElementById('hangupBtn');
        const localVideo = document.getElementById('localVideo');

        let localStream = null;

        // Function to request camera and microphone access
        async function startVideoCall() {
            try {
                // This triggers the browser prompt for camera/mic permissions
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });

                // Attach the stream to the local video element so you can see yourself
                localVideo.srcObject = localStream;

                // Switch UI views
                callBtn.style.display = 'none';
                activeCallGrid.style.display = 'block';
                console.log("Camera and microphone successfully enabled.");

            } catch (error) {
                console.error("Error accessing media devices:", error);
                alert("Permission denied or camera/microphone not found. Please check your browser settings to allow access.");
            }
        }

        // Function to end the call and turn off the camera lights
        function endVideoCall() {
            if (localStream) {
                // Stop all active media tracks (turns off the camera hardware)
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Clear video source
            localVideo.srcObject = null;

            // Switch UI views back
            activeCallGrid.style.display = 'none';
            callBtn.style.display = 'block';
            console.log("Call ended.");
        }

        // Event listeners for buttons
        callBtn.addEventListener('click', startVideoCall);
        hangupBtn.addEventListener('click', endVideoCall);
    </script>
</body>
</html>
