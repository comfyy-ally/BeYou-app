<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TexUs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .app-title {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .tex-part { color: #ec4899; }
        .us-part { color: #10b981; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #059669; }
        .switch-link { margin-top: 15px; font-size: 13px; color: #94a3b8; }
        .switch-link a { color: #10b981; text-decoration: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="card">
        <div class="app-title">
            <span class="tex-part">Tex</span><span class="us-part">Us</span>
        </div>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Create a New Account</p>
        
        <input type="text" id="regUsername" placeholder="Choose a Username">
        <input type="password" id="regPassword" placeholder="Choose a Password">
        <button onclick="registerUser()">Register</button>

        <div class="switch-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRIWC0K8X7V8DUGpco8INUAzv4RekJZ68",
            authDomain: "texus-5c99e.firebaseapp.com",
            projectId: "texus-5c99e",
            storageBucket: "texus-5c99e.firebasestorage.app",
            messagingSenderId: "1040040305137",
            appId: "1:1040040305137:web:86f4f717204378a22da450",
            measurementId: "G-KCF9J53BGH"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function registerUser() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!username || !password) {
                alert("Please fill in both fields!");
                return;
            }

            const userRef = db.collection("users").doc(username);
            userRef.get().then((doc) => {
                if (doc.exists) {
                    alert("That username is already taken. Choose another one.");
                } else {
                    userRef.set({
                        username: username,
                        password: password,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        localStorage.setItem('texus_username', username);
                        localStorage.setItem('texus_user_id', 'user_' + Math.random().toString(36).substring(2, 9));
                        alert("Account created successfully!");
                        window.location.href = 'dashboard.html';
                    }).catch((error) => {
                        alert("Error: " + error.message);
                    });
                }
            });
        }
    </script>
</body>
</html>
