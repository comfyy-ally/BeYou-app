<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BeYou App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #10b981;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #059669;
        }
        .hidden {
            display: none;
        }
        #errorMsg {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Registration Form -->
        <form id="registerForm">
            <h2>Create Account</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <p id="errorMsg"></p>
            <button type="submit">Send Verification Code</button>
        </form>

        <!-- Verification Code Form -->
        <form id="verifyForm" class="hidden">
            <h2>Verify Email</h2>
            <p style="font-size: 13px; text-align: center; color: #94a3b8;">Check your inbox for your 4-digit code.</p>
            <input type="text" id="otp" placeholder="Enter 4-digit code" required>
            <p id="verifyErrorMsg" style="color: #ef4444; font-size: 14px; text-align: center;"></p>
            <button type="button" id="verifyBtn">Verify & Register</button>
        </form>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const verifyForm = document.getElementById('verifyForm');
        let registeredEmail = '';

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            registeredEmail = email;

            const response = await fetch('/api/send-email-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email })
            });

            const data = await response.json();
            if (data.success) {
                if (data.fallbackCode) {
                    alert(data.message);
                } else {
                    alert('Verification code sent to your email! Check your inbox.');
                }
                registerForm.classList.add('hidden');
                verifyForm.classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').innerText = data.message;
            }
        });

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const otp = document.getElementById('otp').value;

            const response = await fetch('/api/verify-email-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: registeredEmail, otp })
            });

            const data = await response.json();
            if (data.success) {
                alert('Account verified and created successfully!');
                window.location.href = '/login.html';
            } else {
                document.getElementById('verifyErrorMsg').innerText = data.message;
            }
        });
    </script>
</body>
</html>
