<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeYou - Register & Verify</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; color: white; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #10b981; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #059669; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #3b82f6; text-decoration: none; }
        .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Register</h2>
        
        <!-- Step 1: User details -->
        <form id="registerForm">
            <input type="text" id="regUsername" placeholder="Choose Username" required>
            <input type="password" id="regPassword" placeholder="Choose Password" required>
            <input type="tel" id="regPhone" placeholder="Phone Number (e.g., +123456789)" required>
            <button type="submit">Send Verification SMS</button>
            <div id="errorMsg" class="error"></div>
        </form>

        <!-- Step 2: SMS Code Verification (Hidden initially) -->
        <form id="verifyForm" class="hidden">
            <p style="font-size: 14px; color: #94a3b8; text-align: center;">Enter the 4-digit code sent to your phone:</p>
            <input type="text" id="otpCode" placeholder="Enter Code" required>
            <button type="submit">Verify & Complete Signup</button>
            <div id="verifyErrorMsg" class="error"></div>
        </form>

        <div class="link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        let generatedOtp = '';
        let pendingUserData = {};

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value;

            // Generate a random 4-digit code (Simulating SMS gateway dispatch)
            generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            pendingUserData = { username, password, phone };

            // In a production app with Twilio, an SMS is sent here. For now, we alert the simulated code:
            alert(`[SMS Gateway Simulated]: Your BeYou verification code is: ${generatedOtp}`);

            // Switch views to OTP input form
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('verifyForm').classList.remove('hidden');
        });

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const enteredOtp = document.getElementById('otpCode').value;

            if (enteredOtp === generatedOtp) {
                // Send verified data to server
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingUserData)
                });

                const data = await response.json();
                if (data.success) {
                    alert('Phone verified and registration successful! Please log in.');
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('verifyErrorMsg').innerText = data.message;
                }
            } else {
                document.getElementById('verifyErrorMsg').innerText = 'Invalid verification code. Try again.';
            }
        });
    </script>
</body>
</html>
