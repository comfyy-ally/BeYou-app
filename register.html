<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TexUs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .register-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .app-title {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .tex-part { color: #ec4899; }
        .us-part { color: #10b981; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #059669;
        }
        .switch-link {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .switch-link a {
            color: #10b981;
            text-decoration: none;
        }
        #code-section {
            display: none;
        }
    </style>

    <!-- Import Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="register-card">
        <div class="app-title">
            <span class="tex-part">Tex</span><span class="us-part">Us</span>
        </div>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Register with your Phone Number</p>
        
        <input type="text" id="username" placeholder="Username">
        <input type="tel" id="phone" placeholder="Phone (e.g. +1234567890)">
        
        <button id="send-code-btn" onclick="sendVerificationCode()">Send SMS Code</button>

        <!-- Hidden section until SMS code is sent -->
        <div id="code-section">
            <input type="text" id="verification-code" placeholder="Enter 6-digit SMS Code">
            <button onclick="verifyCodeAndRegister()">Verify & Complete</button>
        </div>

        <!-- Invisible reCAPTCHA container required by Firebase -->
        <div id="recaptcha-container"></div>
        
        <div class="switch-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRIWC0K8X7V8DUGpco8INUAzv4RekJZ68",
            authDomain: "texus-5c99e.firebaseapp.com",
            projectId: "texus-5c99e",
            storageBucket: "texus-5c99e.firebasestorage.app",
            messagingSenderId: "1040040305137",
            appId: "1:1040040305137:web:86f4f717204378a22da450",
            measurementId: "G-KCF9J53BGH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            });
        };

        let confirmationResultObj = null;

        function sendVerificationCode() {
            const username = document.getElementById('username').value.trim();
            const phoneNumber = document.getElementById('phone').value.trim();

            if (!username || !phoneNumber) {
                alert("Please fill in both your username and phone number (with country code, e.g., +1...)!");
                return;
            }

            localStorage.setItem('temp_texus_username', username);
            const appVerifier = window.recaptchaVerifier;

            firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    alert("SMS verification code sent successfully!");
                    document.getElementById('send-code-btn').style.display = 'none';
                    document.getElementById('code-section').style.display = 'block';
                }).catch((error) => {
                    alert("SMS Error: " + error.message);
                    grecaptcha.reset(window.recaptchaWidgetId);
                });
        }

        function verifyCodeAndRegister() {
            const code = document.getElementById('verification-code').value.trim();
            if (!code) {
                alert("Please enter the 6-digit code sent to your phone.");
                return;
            }

            confirmationResultObj.confirm(code).then((result) => {
                const user = result.user;
                const savedUsername = localStorage.getItem('temp_texus_username') || "User";
                localStorage.setItem('texus_username', savedUsername);
                
                alert("Phone verified and registration successful!");
                window.location.href = 'dashboard.html';
            }).catch((error) => {
                alert("Incorrect code or verification failed: " + error.message);
            });
        }
    </script>
</body>
</html>
