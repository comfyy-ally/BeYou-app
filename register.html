<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - TexUs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0f172a;
            color: white;

            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 92%;
            max-width: 390px;

            background: #1e293b;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.5);

            text-align: center;
        }

        .logo {
            font-family: "Brush Script MT", cursive;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .tex {
            color: #ec4899;
        }

        .us {
            color: #10b981;
        }

        h2 {
            margin-bottom: 22px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin: 8px 0;

            border: 1px solid #475569;

            border-radius: 8px;

            background: #0f172a;

            color: white;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 12px;

            border: none;

            border-radius: 8px;

            background: #ec4899;

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            min-height: 22px;

            margin-top: 14px;

            color: #fda4af;

            font-size: 14px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="auth-card">

    <div class="logo">
        <span class="tex">Tex</span>
        <span class="us">Us</span>
    </div>

    <h2>Create Account</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password (6+ characters)"
        autocomplete="new-password"
    >

    <button
        id="registerBtn"
        onclick="registerUser()"
    >
        Sign Up
    </button>

    <div id="message" class="message"></div>

    <p>
        Already have an account?
        <a href="login.html">Log in</a>
    </p>

</div>

<script>

const firebaseConfig = {

    apiKey: "AIzaSyAwGvF8YZw6hQVPTHLe0QzmTPewWQvrO0o",

    authDomain:
        "texus-5c99e.firebaseapp.com",

    projectId:
        "texus-5c99e",

    storageBucket:
        "texus-5c99e.firebasestorage.app",

    messagingSenderId:
        "1040040305137",

    appId:
        "1:1040040305137:web:86f4f717204378a22da450",

    measurementId:
        "G-KCF9J53BGH"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


function registerUser() {

    const username =
        document.getElementById("username")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerBtn");


    if (!username) {

        message.textContent =
            "Please enter a username.";

        return;
    }


    if (!email) {

        message.textContent =
            "Please enter an email.";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    button.disabled = true;

    message.textContent =
        "Creating your account...";


    firebase.auth()
        .createUserWithEmailAndPassword(
            email,
            password
        )

        .then(function(credential) {

            const user =
                credential.user;


            localStorage.setItem(
                "texus_username",
                username
            );


            localStorage.setItem(
                "texus_user_id",
                user.uid
            );


            return db
                .collection("users")
                .doc(user.uid)
                .set({

                    username: username,

                    email: email,

                    earningsBalance: 0,

                    payoutEmail: "",

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });

        })

        .then(function() {

            window.location.href =
                "dashboard.html";

        })

        .catch(function(error) {

            console.error(error);


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message.textContent =
                    "That email is already registered.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email address.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message.textContent =
                    "Please choose a stronger password.";

            }

            else {

                message.textContent =
                    error.message ||
                    "Registration failed.";

            }


            button.disabled = false;

        });

}

</script>

</body>
</html>
