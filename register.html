<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TexUs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .app-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 46px;
            margin-bottom: 10px;
        }

        .tex-part {
            color: #ec4899;
        }

        .us-part {
            color: #10b981;
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border-radius: 7px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #10b981;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 7px;
            border: none;
            background: #ec4899;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #7f1d1d;
            color: white;
        }

        .success {
            display: block;
            background: #065f46;
            color: white;
        }

        .link-text {
            margin-top: 18px;
            font-size: 14px;
            color: #94a3b8;
        }

        .link-text a {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <div class="auth-card">

        <div class="app-title">
            <span class="tex-part">Tex</span><span class="us-part">Us</span>
        </div>

        <h2>Create Account</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button id="signupButton" onclick="registerUser()">
            Sign Up
        </button>

        <div id="message" class="message"></div>

        <p class="link-text">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

    <script>

        // FIREBASE CONFIGURATION
        // ==========================================

        firebase.initializeApp(firebaseConfig);

        // ==========================================

        async function registerUser() {

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const button =
                document.getElementById("signupButton");

            const message =
                document.getElementById("message");

            // Clear old message
            message.className = "message";
            message.textContent = "";

            // VALIDATION
            // ==========================================

            if (!username) {
                showError("Please enter a username.");
                return;
            }

            if (username.length < 3) {
                showError("Username must be at least 3 characters.");
                return;
            }

            if (!email) {
                showError("Please enter your email.");
                return;
            }

            if (!password) {
                showError("Please enter a password.");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters.");
                return;
            }

            // Disable button while registering
            button.disabled = true;
            button.textContent = "Creating account...";

            try {

                // ==========================================
                // CREATE FIREBASE AUTH ACCOUNT
                // ==========================================

                const userCredential =
                    await firebase.auth()
                    .createUserWithEmailAndPassword(
                        email,
                        password
                    );
