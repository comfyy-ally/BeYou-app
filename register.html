<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs - Create Account</title>
    <style>
        body { background: #0f0f13; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a24; padding: 30px; border-radius: 15px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a3b; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff3366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        a { color: #ff3366; text-decoration: none; font-size: 0.9rem; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color: #ff3366; font-family: cursive;">TexUs</h1>
        <h2>Create Account</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="email" id="email" placeholder="Email Address" />
        <input type="tel" id="phone" placeholder="Cellphone Number (e.g. 0821234567)" />
        <button id="registerBtn">Sign Up</button>
        <a href="login.html">Already have an account? Login</a>
    </div>

    <script>
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!username || !email || !phone) {
                alert('Please fill in all fields.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, phone })
                });
                const data = await response.json();

                if (data.success) {
                    alert('Account created successfully! Please log in.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert('Registration failed.');
            }
        });
    </script>
</body>
</html>
