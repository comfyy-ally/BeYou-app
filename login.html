<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexUs - Login</title>
    <style>
        body { background: #0f0f13; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a24; padding: 30px; border-radius: 15px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a3b; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff3366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        a { color: #ff3366; text-decoration: none; font-size: 0.9rem; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color: #ff3366; font-family: cursive;">TexUs</h1>
        
        <!-- Step 1: Phone input -->
        <div id="step1">
            <h2>Login</h2>
            <input type="tel" id="loginPhone" placeholder="Enter your Cellphone Number" />
            <button id="sendOtpBtn">Send SMS Code</button>
            <a href="register.html">Don't have an account? Sign up</a>
        </div>

        <!-- Step 2: OTP verification -->
        <div id="step2" class="hidden">
            <h2>Verify SMS</h2>
            <p style="color: #aaa; font-size: 0.85rem;">Enter the code sent to your phone</p>
            <input type="text" id="otpInput" placeholder="4-digit code" maxlength="4" />
            <button id="verifyBtn">Verify & Login</button>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const loginPhone = document.getElementById('loginPhone');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpInput = document.getElementById('otpInput');
        const verifyBtn = document.getElementById('verifyBtn');

        let activePhone = '';

        sendOtpBtn.addEventListener('click', async () => {
            activePhone = loginPhone.value.trim();
            if (!activePhone) {
                alert('Please enter your phone number.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/login-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: activePhone })
                });
                const data = await response.json();

                if (data.success) {
                    step1.classList.add('hidden');
                    step2.classList.remove('hidden');
                    // Displaying code for local testing convenience
                    alert(`Simulated SMS Sent! Verification Code: ${data.debugCode}`);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert('Failed to send verification code.');
            }
        });

        verifyBtn.addEventListener('click', async () => {
            const code = otpInput.value.trim();

            try {
                const response = await fetch('http://localhost:3000/api/verify-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: activePhone, code })
                });
                const data = await response.json();

                if (data.success) {
                    alert('Login successful!');
                    window.location.href = 'stream.html'; // Redirect to main app
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
