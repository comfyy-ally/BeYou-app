<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TexUs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .app-title {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .tex-part { color: #ec4899; }
        .us-part { color: #10b981; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #059669;
        }
        .switch-link {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .switch-link a {
            color: #10b981;
            text-decoration: none;
        }
    </style>

    <!-- Import Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <div class="app-title">
            <span class="tex-part">Tex</span><span class="us-part">Us</span>
        </div>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Welcome back! Please login</p>
        
        <input type="email" id="login-email" placeholder="Email Address">
        <input type="password" id="login-password" placeholder="Password">
        
        <button onclick="loginUser()">Login</button>
        
        <div class="switch-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRIWC0K8X7V8DUGpco8INUAzv4RekJZ68",
            authDomain: "texus-5c99e.firebaseapp.com",
            projectId: "texus-5c99e",
            storageBucket: "texus-5c99e.firebasestorage.app",
            messagingSenderId: "1040040305137",
            appId: "1:1040040305137:web:86f4f717204378a22da450",
            measurementId: "G-KCF9J53BGH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        function loginUser() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("Please enter both email and password!");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    if (!userCredential.user.emailVerified) {
                        alert("Please verify your email address before logging in. Check your inbox!");
                        firebase.auth().signOut();
                        return;
                    }
                    alert("Login successful!");
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    alert("Login Error: " + error.message);
                });
        }
    </script>
</body>
</html>
