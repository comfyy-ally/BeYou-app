<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeYou - Login Lock Screen</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; color: white; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3b82f6; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #3b82f6; text-decoration: none; }
        .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 BeYou Lock Screen</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log In</button>
            <div id="errorMsg" class="error"></div>
        </form>
        <div class="link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                // Redirects to your video stream / main app page after successful login
                window.location.href = 'stream.html';
            } else {
                document.getElementById('errorMsg').innerText = data.message;
            }
        });
    </script>
</body>
</html>
