<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TexUs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 92%;
            max-width: 390px;
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            font-family: "Brush Script MT", cursive;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .tex {
            color: #ec4899;
        }

        .us {
            color: #10b981;
        }

        h2 {
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #ec4899;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;
            margin-top: 14px;
            color: #fda4af;
            font-size: 14px;
            line-height: 1.4;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

<body>

<div class="auth-card">

    <div class="logo">
        <span class="tex">Tex</span><span class="us">Us</span>
    </div>

    <h2>Welcome Back</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
        Log In
    </button>

    <div id="message" class="message"></div>

    <p>
        Don't have an account?
        <a href="register.html">Create one</a>
    </p>

</div>

<script>

/* =========================================================
   TEXUS FIREBASE CONFIGURATION
   This is the exact configuration from your Firebase Console.
   ========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAwGvF8YZ6wH6QVPTHLe0QzmTPewWQvrO0o",
    authDomain: "texus-5c99e.firebaseapp.com",
    projectId: "texus-5c99e",
    storageBucket: "texus-5c99e.firebasestorage.app",
    messagingSenderId: "1040040305137",
    appId: "1:1040040305137:web:86f4f717204378a22da450",
    measurementId: "G-KCF9J53BGH"
};


/* =========================================================
   INITIALIZE FIREBASE
   ========================================================= */

let auth = null;

try {

    firebase.initializeApp(firebaseConfig);

    auth = firebase.auth();

    console.log("TexUs Firebase initialized successfully.");

} catch (error) {

    console.error("Firebase initialization error:", error);

    const message =
        document.getElementById("message");

    message.style.color = "#fda4af";

    message.textContent =
        "Firebase could not be initialized. Please refresh the page.";
}


/* =========================================================
   LOGIN ELEMENTS
   ========================================================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/* =========================================================
   KEEP USER LOGGED IN
   ========================================================= */

if (auth) {

    auth.setPersistence(
        firebase.auth.Auth.Persistence.LOCAL
    )
    .then(() => {

        console.log(
            "TexUs authentication persistence enabled."
        );

    })
    .catch(error => {

        console.error(
            "Firebase persistence error:",
            error
        );

    });


    /*
       If Firebase already has a valid login session,
       send the user directly to the dashboard.
    */

    auth.onAuthStateChanged(user => {

        if (user) {

            console.log(
                "Existing TexUs session:",
                user.email
            );

            /*
               Don't redirect while the user is
               actively trying to log in.
            */

            if (!loginBtn.disabled) {

                window.location.replace(
                    "dashboard.html"
                );

            }

        }

    });

}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

loginBtn.addEventListener(
    "click",
    loginUser
);


/* =========================================================
   ALLOW ENTER KEY TO LOGIN
   ========================================================= */

emailInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            loginUser();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            loginUser();

        }

    }
);


/* =========================================================
   LOGIN FUNCTION
   ========================================================= */

async function loginUser() {

    if (!auth) {

        message.style.color = "#fda4af";

        message.textContent =
            "Firebase is not available. Please refresh the page.";

        return;
    }


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    /* -----------------------------------------
       CHECK INPUT
       ----------------------------------------- */

    if (!email) {

        message.style.color = "#fda4af";

        message.textContent =
            "Please enter your email address.";

        emailInput.focus();

        return;
    }


    if (!password) {

        message.style.color = "#fda4af";

        message.textContent =
            "Please enter your password.";

        passwordInput.focus();

        return;
    }


    /* -----------------------------------------
       START LOGIN
       ----------------------------------------- */

    loginBtn.disabled = true;

    message.style.color = "#94a3b8";

    message.textContent =
        "Logging in...";


    try {

        /*
           Make sure Firebase keeps the user
           signed in after closing or refreshing.
        */

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        /*
           Sign in using Firebase Email/Password.
        */

        const result =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        console.log(
            "TexUs login successful:",
            result.user.email
        );


        message.style.color = "#10b981";

        message.textContent =
            "Login successful! Opening TexUs...";


        /*
           Firebase has successfully authenticated
           the user. Now open the dashboard.
        */

        setTimeout(() => {

            window.location.replace(
                "dashboard.html"
            );

        }, 500);


    } catch (error) {

        console.error(
            "TexUs Firebase login error:",
            error
        );

        console.error(
            "Firebase error code:",
            error.code
        );


        message.style.color = "#fda4af";

        message.textContent =
            getErrorMessage(error);


        loginBtn.disabled = false;

    }

}


/* =========================================================
   FIREBASE ERROR MESSAGES
   ========================================================= */

function getErrorMessage(error) {

    switch (error.code) {

        case "auth/invalid-api-key":

        case "auth/api-key-not-valid":

            return "Firebase API key is not being accepted. Please refresh and try again.";


        case "auth/invalid-email":

            return "Please enter a valid email address.";


        case "auth/invalid-credential":

        case "auth/wrong-password":

            return "Email or password is incorrect.";


        case "auth/user-not-found":

            return "No account was found with this email.";


        case "auth/user-disabled":

            return "This account has been disabled.";


        case "auth/too-many-requests":

            return "Too many login attempts. Please try again later.";


        case "auth/network-request-failed":

            return "Network error. Please check your internet connection.";


        case "auth/operation-not-allowed":

            return "Email and Password sign-in is not enabled in Firebase.";


        case "auth/internal-error":

            return "Firebase encountered an internal error. Please try again.";


        default:

            return error.message ||
                "Login failed. Please try again.";

    }

}

</script>

</body>
</html>
