<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TexUs</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .app-title {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .tex-part {
            color: #ec4899;
        }

        .us-part {
            color: #10b981;
        }

        h2 {
            margin: 5px 0 20px;
        }

        .input-group {
            position: relative;
            margin: 10px 0;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #10b981;
        }

        .password-input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #10b981;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            padding: 5px;
            margin: 0;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 6px;
            border: none;
            background-color: #10b981;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .login-button:hover {
            background-color: #059669;
        }

        .login-button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            color: #10b981;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .link-text {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .link-text a {
            color: #ec4899;
            text-decoration: none;
            font-weight: bold;
        }

        .link-text a:hover {
            text-decoration: underline;
        }

        .status-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .error-message {
            background-color: #450a0a;
            color: #fecaca;
            border: 1px solid #ef4444;
        }

        .success-message {
            background-color: #064e3b;
            color: #d1fae5;
            border: 1px solid #10b981;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <!-- TEXUS LOGO -->
        <div class="app-title">
            <span class="tex-part">Tex</span><span class="us-part">Us</span>
        </div>

        <h2>Welcome Back</h2>

        <!-- EMAIL -->
        <div class="input-group">
            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
            >
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <input
                type="password"
                id="password"
                class="password-input"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
                id="showPasswordButton"
            >
                Show
            </button>
        </div>

        <!-- LOGIN BUTTON -->
        <button
            type="button"
            class="login-button"
            id="loginButton"
            onclick="loginUser()"
        >
            Sign In
        </button>

        <!-- FORGOT PASSWORD -->
        <a
            class="forgot-password"
            onclick="forgotPassword()"
        >
            Forgot your password?
        </a>

        <!-- STATUS -->
        <div
            id="statusMessage"
            class="status-message"
        ></div>

        <!-- REGISTER -->
        <p class="link-text">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>


    <script>

        // =====================================================
        // TEXUS FIREBASE CONFIGURATION
        // =====================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBLWsJhuxdhDJgvnMnclXdYhAcQv5RrGm0",
            authDomain: "texus-5c99e.firebaseapp.com",
            projectId: "texus-5c99e",
            storageBucket: "texus-5c99e.firebasestorage.app",
            messagingSenderId: "1040040305137",
            appId: "1:1040040305137:web:86f4f717204378a22da450",
            measurementId: "G-KCF9J53BGH"
        };


        // Start Firebase
        firebase.initializeApp(firebaseConfig);

        // Firebase Authentication
        const auth = firebase.auth();


        // =====================================================
        // CHECK IF USER IS ALREADY LOGGED IN
        // =====================================================

        auth.onAuthStateChanged(function(user) {

            if (user) {

                console.log("User already logged in:", user.email);

                // Send user to dashboard
                window.location.href = "dashboard.html";
            }

        });


        // =====================================================
        // LOGIN
        // =====================================================

        function loginUser() {

            const email = document
                .getElementById("email")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value;

            const loginButton = document.getElementById("loginButton");

            // Check email
            if (!email) {
                showError("Please enter your email address.");
                return;
            }

            // Check password
            if (!password) {
                showError("Please enter your password.");
                return;
            }

            // Disable button while logging in
            loginButton.disabled = true;
            loginButton.innerText = "Signing in...";

            clearMessage();

            auth.signInWithEmailAndPassword(email, password)

                .then(function(userCredential) {

                    const user = userCredential.user;

                    console.log("Login successful:", user.uid);

                    showSuccess("Login successful! Opening TexUs...");

                    // Save Firebase user ID
                    localStorage.setItem(
                        "texus_user_id",
                        user.uid
                    );

                    // Save email
                    localStorage.setItem(
                        "texus_email",
                        user.email
                    );

                    // Go to dashboard
                    setTimeout(function() {
                        window.location.href = "dashboard.html";
                    }, 700);

                })

                .catch(function(error) {

                    console.error("Login error:", error);

                    let message = "Unable to log in.";

                    switch (error.code) {

                        case "auth/invalid-email":
                            message = "Please enter a valid email address.";
                            break;

                        case "auth/user-not-found":
                            message = "No TexUs account was found with this email.";
                            break;

                        case "auth/wrong-password":
                            message = "Incorrect password.";
                            break;

                        case "auth/invalid-credential":
                            message = "Incorrect email or password.";
                            break;

                        case "auth/user-disabled":
                            message = "This account has been disabled.";
                            break;

                        case "auth/too-many-requests":
                            message = "Too many login attempts. Please try again later.";
                            break;

                        case "auth/network-request-failed":
                            message = "Internet connection problem. Please check your connection.";
                            break;

                        default:
                            message = error.message;
                    }

                    showError(message);

                    loginButton.disabled = false;
                    loginButton.innerText = "Sign In";
                });
        }


        // =====================================================
        // SHOW / HIDE PASSWORD
        // =====================================================

        function togglePassword() {

            const passwordInput =
                document.getElementById("password");

            const button =
                document.getElementById("showPasswordButton");

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                button.innerText = "Hide";

            } else {

                passwordInput.type = "password";
                button.innerText = "Show";
            }
        }


        // =====================================================
        // FORGOT PASSWORD
        // =====================================================

        function forgotPassword() {

            const email = document
                .getElementById("email")
                .value
                .trim();

            if (!email) {

                showError(
                    "Enter your email address first, then click Forgot your password."
                );

                return;
            }

            auth.sendPasswordResetEmail(email)

                .then(function() {

                    showSuccess(
                        "Password reset email sent. Check your email inbox."
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    let message =
                        "Could not send password reset email.";

                    if (error.code === "auth/user-not-found") {
                        message =
                            "No TexUs account was found with this email.";
                    }

                    if (error.code === "auth/invalid-email") {
                        message =
                            "Please enter a valid email address.";
                    }

                    showError(message);
                });
        }


        // =====================================================
        // DISPLAY ERROR
        // =====================================================

        function showError(message) {

            const box =
                document.getElementById("statusMessage");

            box.className =
                "status-message error-message";

            box.innerText = message;

            box.style.display = "block";
        }


        // =====================================================
        // DISPLAY SUCCESS
        // =====================================================

        function showSuccess(message) {

            const box =
                document.getElementById("statusMessage");

            box.className =
                "status-message success-message";

            box.innerText = message;

            box.style.display = "block";
        }


        // =====================================================
        // CLEAR MESSAGE
        // =====================================================

        function clearMessage() {

            const box =
                document.getElementById("statusMessage");

            box.style.display = "none";
            box.innerText = "";
        }


        // =====================================================
        // PRESS ENTER TO LOGIN
        // =====================================================

        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    loginUser();
                }

            });

    </script>

</body>
</html>
