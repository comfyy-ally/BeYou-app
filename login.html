<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TexUs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 92%;
            max-width: 390px;
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            font-family: "Brush Script MT", cursive;
            font-size: 48px;
            margin-bottom: 10px;
        }

        .tex {
            color: #ec4899;
        }

        .us {
            color: #10b981;
        }

        h2 {
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #ec4899;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;
            margin-top: 14px;
            color: #fda4af;
            font-size: 14px;
        }

        .success {
            color: #10b981;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

<body>

<div class="auth-card">

    <div class="logo">
        <span class="tex">Tex</span><span class="us">Us</span>
    </div>

    <h2>Welcome Back</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn" onclick="loginUser()">
        Log In
    </button>

    <div id="message" class="message"></div>

    <p>
        Don't have an account?
        <a href="register.html">Create one</a>
    </p>

</div>

<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAwGvF8YZ6wH6QVPTHLe0QzmTPewWQvrO0o",
    authDomain: "texus-5c99e.firebaseapp.com",
    projectId: "texus-5c99e",
    storageBucket: "texus-5c99e.firebasestorage.app",
    messagingSenderId: "1040040305137",
    appId: "1:1040040305137:web:86f4f717204378a22da450",
    measurementId: "G-KCF9J53BGH"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();


/* =========================================
   AUTHENTICATION PERSISTENCE
========================================= */

let checkingLogin = true;

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.then(function() {

    /*
     * Firebase will now restore the saved
     * login session from this browser.
     */

    auth.onAuthStateChanged(function(user) {

        checkingLogin = false;

        /*
         * Only redirect when Firebase has
         * confirmed that a real user is logged in.
         */

        if (user) {

            console.log(
                "TexUs: Existing login session found."
            );

            window.location.replace("dashboard.html");

        }

    });

})
.catch(function(error) {

    checkingLogin = false;

    console.error(
        "Authentication persistence error:",
        error
    );

});


/* =========================================
   LOGIN USER
========================================= */

async function loginUser() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginBtn");


    /* Clear old message */

    message.className = "message";


    /* Check fields */

    if (!email || !password) {

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    /* Disable button */

    button.disabled = true;

    button.textContent = "Logging in...";

    message.textContent = "";


    try {

        /*
         * Make sure the session is saved locally.
         */

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        /*
         * Sign in and WAIT for Firebase to finish.
         */

        const userCredential =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        console.log(
            "TexUs login successful:",
            userCredential.user.email
        );


        message.className =
            "message success";

        message.textContent =
            "Login successful. Opening TexUs...";


        /*
         * Give Firebase a moment to finish
         * updating the authentication state.
         */

        await userCredential.user.getIdToken();


        /*
         * Replace the login page instead of adding
         * it to browser history.
         */

        window.location.replace(
            "dashboard.html"
        );

    }

    catch (error) {

        console.error(
            "TexUs login error:",
            error
        );


        message.className =
            "message";

        message.textContent =
            getErrorMessage(error);


        button.disabled = false;

        button.textContent = "Log In";

    }

}


/* =========================================
   FIREBASE ERROR MESSAGES
========================================= */

function getErrorMessage(error) {

    if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password"
    ) {

        return "Email or password is incorrect.";

    }


    if (
        error.code === "auth/user-not-found"
    ) {

        return "No account was found with this email.";

    }


    if (
        error.code === "auth/invalid-email"
    ) {

        return "Please enter a valid email address.";

    }


    if (
        error.code === "auth/too-many-requests"
    ) {

        return "Too many attempts. Please try again later.";

    }


    if (
        error.code === "auth/network-request-failed"
    ) {

        return "Network error. Check your internet connection.";

    }


    if (
        error.code === "auth/api-key-not-valid"
    ) {

        return "Firebase API key is not valid. Please check your Firebase settings.";

    }


    if (
        error.code === "auth/operation-not-allowed"
    ) {

        return "Email/password login is not enabled in Firebase Authentication.";

    }


    if (
        error.code === "auth/user-disabled"
    ) {

        return "This account has been disabled.";

    }


    if (
        error.code === "auth/requests-from-referer-https://beyou-app.onrender.com-are-blocked."
    ) {

        return "This website is blocked by your Firebase API key settings.";

    }


    return error.message ||
        "Login failed. Please try again.";

}

</script>

</body>
</html>
